name: SHIFT LINE V177 Worlds Mastery and Rematches
on:
  push:
    branches: [world-mastery-v177]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Six airframes, six courses, bounded moments and progress isolation
        run: |
          for file in public/*.js; do node --check "$file"; done
          for name in world-mastery-v177 flight-flow-v176 performance-v175 runtime-v152 performance-v171 racing-polish-v146 fleet-v162 finish-portal-v174; do
            node --experimental-loader ./test/three-loader.mjs "test/$name.mjs"
          done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
        courses: ['1,2','3,4','5,6']
        include:
          - browser: chromium
            courses: '1,4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Prepare mobile browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.browser }}
          cat test/runtime-bridge-v152.js >> public/race-engine.js
          cat test/flight-flow-bridge-v176.js >> public/race-engine.js
          cat test/world-mastery-bridge-v177.js >> public/race-engine.js
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-v177.log 2>&1 &
      - name: Six-world signatures, Ultra cockpit, garage handling and mastery
        env:
          WORLD_BROWSER: ${{ matrix.browser }}
          WORLD_COURSES: ${{ matrix.courses }}
        run: node test/world-mastery-browser-v177.mjs
      - name: Retain portrait and landscape sector practice controls
        if: matrix.browser == 'webkit' && matrix.courses == '1,2'
        run: node test/flight-layout-browser-v176.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-mastery-v177-${{ matrix.browser }}-${{ matrix.courses }}
          path: |
            qa-v177
            qa-v176-layout
          if-no-files-found: ignore
  rematch-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Prepare WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
          cat test/runtime-bridge-v152.js >> public/race-engine.js
          cat test/flight-flow-bridge-v176.js >> public/race-engine.js
          cat test/world-mastery-bridge-v177.js >> public/race-engine.js
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-room177.log 2>&1 &
      - name: Drive rematch and next-course controls through existing messages
        run: node test/room-ui-browser-v177.mjs
  real-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Confirm deployed server supports same-room rematches and host transfer
        run: node --experimental-loader ./test/three-loader.mjs test/multiplayer-session-v177.mjs
