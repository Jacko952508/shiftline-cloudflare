name: SHIFTLINE Exterior World Safety
on:
  push:
    branches: [main]
    paths:
      - 'public/far-scenery-v129.js'
      - 'public/race-world.js'
      - 'public/race-engine.js'
      - 'public/index.html'
      - 'test/far-scenery-v129.mjs'
      - 'test/far-scenery-v130.mjs'
      - '.github/workflows/far-scenery-v129.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          node --check public/far-scenery-v129.js
          node --check public/race-world.js
          node --check public/race-engine.js
      - name: Test all six exterior environments
        run: node --experimental-loader ./test/three-loader.mjs test/far-scenery-v129.mjs
