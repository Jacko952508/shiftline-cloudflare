name: SHIFTLINE V124 glass QA
on:
  push:
    branches: [main]
    paths:
      - 'public/surface-detail.js'
      - 'public/tunnel-geometry.js'
      - 'public/tunnel-glass-v124.js'
      - 'public/race-world.js'
      - 'public/cinder-world.js'
      - 'public/leviathan-world.js'
      - 'public/expansion-world.js'
      - 'public/race-engine.js'
      - 'public/live-track-explorer.js'
      - 'public/index.html'
      - 'test/glass-v124.mjs'
      - '.github/workflows/glass-v124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check all glass and world modules
        run: |
          node --check public/tunnel-glass-v124.js
          node --check public/surface-detail.js
          node --check public/tunnel-geometry.js
          node --check public/race-world.js
          node --check public/leviathan-world.js
          node --check public/cinder-world.js
          node --check public/expansion-world.js
          node --check public/race-engine.js
          node --check test/glass-v124.mjs
      - name: Install desktop and iPhone-sized browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Start the actual game from checked-out source
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-glass-v124.log 2>&1 &
          sleep 2
      - name: Test six course windows and WebKit glass rendering
        run: node test/glass-v124.mjs
