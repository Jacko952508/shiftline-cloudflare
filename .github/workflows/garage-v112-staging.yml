name: SHIFTLINE V112 Garage Staging Validation
on:
  push:
    branches: [garage-redesign-v112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check all application JavaScript modules
        run: |
          find public -maxdepth 2 -type f -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n 1 node --check
          node --check test/garage-v112.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium
      - name: Serve branch code locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-garage.log 2>&1 &
          sleep 2
      - name: Verify six ship builds, horizontal garage, saved progress and gold cockpit
        run: node test/garage-v112.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-v112-screenshots
          path: garage-screenshots
          if-no-files-found: ignore
