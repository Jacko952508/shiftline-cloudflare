name: SHIFTLINE V150 Alpine and Fleet Review
on:
  push:
    branches: [graphics-v150]
    paths: ['public/**', 'test/**', '.github/workflows/alpine-fleet-v150.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: art-v150-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Geometry, materials and physics regressions
        run: |
          node --experimental-loader ./test/three-loader.mjs test/alpine-v150.mjs
          node --experimental-loader ./test/three-loader.mjs test/far-scenery-v130.mjs
          node --experimental-loader ./test/three-loader.mjs test/terrain-v141.mjs
          node --experimental-loader ./test/three-loader.mjs test/art-direction-v148.mjs
          node --experimental-loader ./test/three-loader.mjs test/obstacle-v126.mjs
          node --experimental-loader ./test/three-loader.mjs test/chapter-landmarks-v143.mjs
          node --experimental-loader ./test/three-loader.mjs test/racing-polish-v146.mjs
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-art.log 2>&1 &
          sleep 2
      - name: Inspect four Tempest chapters, native iPhone race and cockpit
        env:
          SHIFTLINE_ART_COURSES: '4'
          SHIFTLINE_ART_RACE_COURSE: '4'
          SHIFTLINE_ALPINE_REVIEW: '1'
          SHIFTLINE_GRAPHICS_OUTPUT: alpine-v150-frames
        run: node test/graphics-browser-v147.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiftline-v150-tempest
          path: alpine-v150-frames
          if-no-files-found: ignore
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all six craft assemblies and exhaust
        run: node --experimental-loader ./test/three-loader.mjs test/fleet-v121.mjs
      - name: Install mobile browsers
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium webkit
      - name: Serve fleet candidate
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-fleet.log 2>&1 &
          sleep 2
      - name: Verify and capture all six garage ships and paint choices
        run: node test/garage-visible-v115.mjs
      - name: Check iPhone WebKit showroom
        run: node test/garage-webkit-v115.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiftline-v150-fleet
          path: garage-visible-artifacts
          if-no-files-found: ignore
