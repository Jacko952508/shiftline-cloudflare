name: SHIFTLINE V147 Graphics Finish
on:
  push:
    branches: [graphics-v147]
    paths: ['public/**', 'test/graphics-*.mjs', '.github/workflows/graphics-v147.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  materials-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify graphics source and safety
        run: |
          node --check public/race-finish-v147.js
          node --experimental-loader ./test/three-loader.mjs test/graphics-v147.mjs
          node --experimental-loader ./test/three-loader.mjs test/final-polish-v145.mjs
          node --experimental-loader ./test/three-loader.mjs test/far-scenery-v130.mjs
      - name: Install real WebGL browsers
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium webkit
      - name: Start candidate server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-graphics.log 2>&1 &
          sleep 2
      - name: Inspect six worlds, native iPhone rendering and cockpit
        run: node test/graphics-browser-v147.mjs
      - name: Verify high-DPI native viewport and boost exhaust
        run: node test/race-visual-v123.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiftline-v147-graphics-review
          path: graphics-v147-frames
          if-no-files-found: ignore
