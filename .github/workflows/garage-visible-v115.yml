name: SHIFTLINE V120 One-Phase Ship Overhaul
on:
  push:
    branches: [ship-overhaul-v120, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-v120-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  garage-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          find public -maxdepth 2 -type f -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n 1 node --check
          node --check test/garage-visible-v115.mjs
          node --check test/garage-webkit-v115.mjs
          node --check test/fleet-race-v117.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium webkit
      - name: Start staging webserver
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/shiftline-stage.log 2>&1 &
          sleep 2
      - name: Measure real garage ship pixels
        run: node test/garage-visible-v115.mjs
      - name: Verify WebKit can display the ship on iPhone-sized screen
        run: node test/garage-webkit-v115.mjs
      - name: Smoke test racing with an upgraded SPECTRE and saved progress
        run: node test/fleet-race-v117.mjs
      - name: Wait for production Cloudflare to serve v128
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 60); do
            if curl -fsSL --connect-timeout 10 --max-time 20 'https://shiftline-game.beyondthebox.workers.dev/?cachecheck=v131' | grep -q 'race-engine.js?v=131'; then
              echo "PASS Cloudflare serving new game engine"
              exit 0
            fi
            echo "Cloudflare not yet updated, retry $i"
            sleep 10
          done
          echo "FAIL Cloudflare did not deploy v124" >&2
          exit 1
      - name: Check actual production ship pixels in Chromium
        if: github.ref == 'refs/heads/main'
        env:
          SHIFTLINE_SITE: https://shiftline-game.beyondthebox.workers.dev
        run: node test/garage-visible-v115.mjs
      - name: Check actual production ship pixels in WebKit
        if: github.ref == 'refs/heads/main'
        env:
          SHIFTLINE_SITE: https://shiftline-game.beyondthebox.workers.dev
        run: node test/garage-webkit-v115.mjs
      - name: Smoke test the Cloudflare race build
        if: github.ref == 'refs/heads/main'
        env:
          SHIFTLINE_SITE: https://shiftline-game.beyondthebox.workers.dev
        run: node test/fleet-race-v117.mjs
      - name: Upload diagnostic images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-visible-v115
          path: garage-visible-artifacts
          if-no-files-found: ignore
