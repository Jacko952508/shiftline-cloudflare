<!doctype html><html><head><meta charset="utf-8"><title>V7 smoke</title><style>html,body{margin:0}#vxStage{width:420px;height:660px;position:relative}#vxCanvas{width:100%;height:100%}.vxTopOptions{position:absolute;top:65px;left:3px}.vxActions{position:absolute;bottom:0;right:0}</style></head><body>
<div id="voxRoot">
<div class="vxName">VOXEL FORGE HD</div><div class="vxSub"></div>
<div id="vxStage">
<canvas id="vxCanvas"></canvas>
<div id="vxLoad">LOADING</div><div id="vxFps"></div><div id="vxLocation"></div><div id="vxTarget"></div><div id="vxToast"></div>
<div class="vxTopOptions">
<select id="vxWeather"><option value="clear">Clear</option><option value="rain">Rain</option><option value="night">Night</option></select>
<select id="vxQuality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
<button id="vxInventory">Inventory</button><button id="vxReset">Spawn</button>
</div>
<div id="vxJoystick" class="vxJoystick"><div id="vxNub"></div></div>
<div class="vxActions"><button id="vxMine">Mine</button><button id="vxPlace">Place</button><button id="vxJump">Jump</button><button id="vxRun">Run</button></div>
<div id="vxHotbar"></div>
</div></div>
<script type="module">
try{const m=await import('./engine-v7.js');window.__active=await m.mount(document.querySelector('#voxRoot'));window.__result={ok:true,buttons:[...document.querySelectorAll('button')].map(b=>b.textContent).slice(0,12)}}
catch(e){window.__result={ok:false,error:String(e),stack:e?.stack};console.error(e)}
</script>
</body></html>
